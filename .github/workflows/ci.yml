name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast feedback: static checks + unit tests. No external services needed.
  quality:
    name: Lint, build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Not `npm run lint`: that script uses --fix, which would auto-fix
      # problems in the CI workspace and report success. Prettier runs as an
      # ESLint rule, so this also fails on unformatted code.
      - name: Lint
        run: npm run lint:check

      # Catches type errors that lint and ts-jest can miss.
      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:cov -- --ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Needs Postgres: verifies migrations apply to an empty database, then runs e2e.
  integration:
    name: Migrations & e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: rental_test
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-fedcba9876543210
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build if any migration is broken on a fresh database.
      - name: Run migrations
        run: npm run migration:run

      # The e2e suite needs the permission catalog and system roles.
      - name: Seed
        run: npm run seed

      # Fails if the entities differ from the migrated schema (a missing migration).
      - name: Check schema drift
        run: npm run typeorm -- migration:generate src/database/migrations/Drift --check

      - name: E2E tests
        run: npm run test:e2e -- --ci

      # Verifies every down() works, then that the migrations re-apply.
      - name: Revert all migrations
        run: |
          npm run migration:revert
          npm run migration:revert

      - name: Re-run migrations
        run: npm run migration:run

  # Separate job so a newly published advisory shows up as its own status
  # without blocking unrelated PRs. Don't mark it as a required check.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high